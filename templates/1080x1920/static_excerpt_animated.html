<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <meta name="viewport" content="width=1080, height=1920">
    <title>图书摘抄 - 1080x1920 (动画版)</title>
    <!-- Google Fonts - 中文字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Serif SC', serif;
            color: #2a2a2a;
            position: relative;
            background: transparent;
            display: flex;
            flex-direction: column;
            padding: 80px 100px;
        }

        /* 背景遮罩层动画 */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(232, 229, 224, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 0;
            animation: overlayFadeIn 1.5s ease-out both;
        }

        /* ========================================
           动画定义
           ======================================== */

        /* 背景遮罩淡入 */
        @keyframes overlayFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 标题淡入下落 */
        @keyframes titleFadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 下划线从中心展开 */
        @keyframes underlineExpand {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        /* 文字逐行出现 */
        @keyframes textRevealLine {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 署名淡入 */
        @keyframes authorFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* 签名上滑淡入 */
        @keyframes signatureSlideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 文字发光呼吸 */
        @keyframes textGlowBreath {
            0%, 100% {
                text-shadow: none;
            }
            50% {
                text-shadow: 0 0 20px rgba(42, 42, 42, 0.2);
            }
        }

        /* ========================================
           应用动画
           ======================================== */

        /* 顶部标题 */
        .header {
            position: relative;
            z-index: 1;
            margin-bottom: 80px;
            animation: titleFadeInDown 1s ease-out 0.3s both;
        }

        .title {
            font-size: 48px;
            font-weight: 500;
            font-family: 'Ma Shan Zheng', 'ZCOOL KuaiLe', cursive;
            color: #2a2a2a;
            letter-spacing: 8px;
            text-align: left;
            padding-bottom: 15px;
            border-bottom: 2px solid #2a2a2a;
            position: relative;
        }

        /* 标题下划线动画 */
        .title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 2px;
            background: #2a2a2a;
            animation: underlineExpand 1s ease-out 0.8s both;
        }

        /* 正文区域 */
        .content {
            position: relative;
            z-index: 1;
            margin-bottom: 60px;
            animation: textRevealLine 1.2s ease-out 0.6s both;
        }

        .excerpt {
            font-size: 36px;
            font-weight: 400;
            line-height: 2.0;
            font-family: 'Noto Serif SC', serif;
            color: #2a2a2a;
            text-align: justify;
            text-indent: 2em;
            letter-spacing: 1px;
            white-space: pre-line;
        }

        /* 署名 */
        .author {
            position: relative;
            z-index: 1;
            text-align: right;
            font-size: 32px;
            font-family: 'Noto Serif SC', serif;
            color: #2a2a2a;
            font-weight: 400;
            animation: authorFadeIn 1s ease-out 1.2s both;
        }

        .signature {
            position: absolute;
            font-size: 24px;
            font-family: 'Liu Jian Mao Cao', 'ZCOOL KuaiLe', cursive;
            color: #333;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            animation: signatureSlideUp 1s ease-out 1.5s both;
        }

        /* 装饰性元素：文字轻微呼吸效果（可选） */
        .excerpt {
            animation: textGlowBreath 5s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <!-- 顶部标题 -->
    <div class="header">
        <div class="title">{{title}}</div>
    </div>

    <!-- 正文内容 -->
    <div class="content">
        <div class="excerpt">{{text}}</div>
    </div>

    <!-- 作者 -->
    <div class="author">——{{author=@码孖AI}}</div>

    <!-- 署名 -->
    <div class="signature">{{signature=@码孖AI}}</div>
</body>

</html>
