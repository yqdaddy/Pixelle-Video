<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <meta name="viewport" content="width=1920, height=1080">
    <title>视频模板 - 电影风格 (动画版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
        }

        body {
            background: black;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* ========================================
           动画定义
           ======================================== */

        /* 标题从黑屏淡入 */
        @keyframes titleFadeInFromBlack {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 标题缓慢缩放 */
        @keyframes titleSlowZoom {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.05);
            }
        }

        /* 图片 Ken Burns 效果 */
        @keyframes kenBurnsIn {
            0% {
                transform: scale(1) translateY(0);
            }
            100% {
                transform: scale(1.15) translateY(-3%);
            }
        }

        /* 文字底部淡入上滑 */
        @keyframes textFadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer 延迟淡入 */
        @keyframes footerFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Logo 点点亮动画 */
        @keyframes logoMarkActivate {
            0%, 100% {
                background: rgba(149, 165, 166, 0.45);
            }
            50% {
                background: rgba(149, 165, 166, 0.75);
                box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
        }

        /* ========================================
           应用动画
           ======================================== */

        .main {
            width: 100%;
            height: 1000px;
            margin-bottom: 80px;
        }

        .top {
            width: 100%;
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 60px;
            z-index: 1;
        }

        .title {
            width: 100%;
            text-align: center;
            font-size: 70px;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 0 6px 22px rgba(0, 0, 0, 0.6);
            letter-spacing: 4px;
            /* 从黑屏淡入 + 缓慢缩放 */
            animation: titleFadeInFromBlack 1.5s ease-out 0.3s both,
                       titleSlowZoom 8s ease-in-out 2s forwards;
        }

        .middle {
            width: 100%;
            height: 70%;
            overflow: hidden;
            position: relative;
        }

        .middle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            /* Ken Burns 效果 - 缓慢推进 */
            animation: kenBurnsIn 10s ease-in-out 0.8s both;
        }

        .bottom {
            width: 100%;
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 60px;
            z-index: 1;
        }

        .text {
            width: 100%;
            padding: 0 60px;
            text-align: center;
            font-size: 40px;
            font-weight: 400;
            line-height: 1.2;
            color: #ffffff;
            letter-spacing: 1px;
            text-shadow: 0 0 0 #000,
                -3px -3px 0 #000,
                3px -3px 0 #000,
                -3px 3px 0 #000,
                3px 3px 0 #000,
                0 10px 24px rgba(0, 0, 0, 0.6);
            /* 底部淡入上滑 */
            animation: textFadeInUp 1.2s ease-out 1.5s both;
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 25px 20px 0 20px;
            position: absolute;
            bottom: 20px;
            color: #fff;
            text-shadow: -1px -1px 0 #000,
                1px -1px 0 #000,
                -1px 1px 0 #000,
                1px 1px 0 #000;
            /* 延迟淡入 */
            animation: footerFadeIn 1s ease-out 2s both;
        }

        .author {
            display: flex;
            flex-direction: column;
            gap: 6px;
            letter-spacing: 2px;
        }

        .author-name {
            font-size: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-mark {
            width: 8px;
            height: 8px;
        }

        .author-desc {
            font-size: 22px;
            line-height: 1.3;
            font-weight: 400;
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .logo {
            font-size: 24px;
            font-weight: 500;
        }

        .logo-marks {
            display: flex;
            gap: 5px;
        }

        .logo-mark {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(149, 165, 166, 0.45);
        }

        .logo-mark.active {
            background: rgba(149, 165, 166, 0.75);
        }

        /* Logo 点依次点亮 */
        .logo-mark:nth-child(1) {
            animation: logoMarkActivate 2s ease-in-out 2.2s infinite;
        }

        .logo-mark:nth-child(2).active {
            animation: logoMarkActivate 2s ease-in-out 2.5s infinite;
        }

        .logo-mark:nth-child(3) {
            animation: logoMarkActivate 2s ease-in-out 2.8s infinite;
        }

        .logo-mark:nth-child(4) {
            animation: logoMarkActivate 2s ease-in-out 3.1s infinite;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="top">
            <div class="title">{{title}}</div>
        </div>
        <div class="middle">
            <img src="{{image}}" alt="内容图片">
        </div>
        <div class="bottom">
            <div class="text">{{text}}</div>
        </div>
    </div>
    <div class="footer">
        <div class="author">
            <div class="author-name">
                <span class="author-mark"></span>
                <div class="logo">{{author=@Pixelle.AI}}</div>
            </div>
            <div class="author-desc">{{describe=码孖AI智能视频创作平台}}</div>
        </div>
        <div class="logo-section">
            <div class="logo">{{brand=码孖AI}}</div>
            <div class="logo-marks">
                <div class="logo-mark"></div>
                <div class="logo-mark active"></div>
                <div class="logo-mark"></div>
                <div class="logo-mark"></div>
            </div>
        </div>
    </div>
</body>

</html>
